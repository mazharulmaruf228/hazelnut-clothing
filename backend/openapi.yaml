openapi: 3.1.0
security: []
info:
  title: Clothing Catalogue API
  version: 1.0.0
  description: >-
    Express owns persistence. Public endpoints return only published products and
    active variants. Guest orders revalidate prices, calculate district-based
    delivery charges, and reserve per-variant stock for manual review. Hosted
    SSLCOMMERZ payments are sandbox-only; live payments and carrier integration
    are not included.
    Amounts are decimal strings in BDT. ADMIN and EDITOR may manage catalogue
    content; only ADMIN manages users. Cookie-authenticated mutations require an
    exact trusted Origin and x-csrf-token from GET /auth/csrf.
servers:
  - url: /api
tags:
  - name: Public
  - name: Authentication
  - name: Catalogue management
  - name: Users
  - name: Orders
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        "200": { description: Process is listening }
  /ready:
    get:
      summary: PostgreSQL readiness
      responses:
        "200": { description: PostgreSQL query succeeded }
        "500": { $ref: "#/components/responses/Error" }
  /products:
    get:
      tags: [Public]
      summary: Published product catalogue, including descendant category matches
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: category, in: query, description: Category slug, schema: { type: string } }
        - { name: featured, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 12 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, name, price-asc, price-desc], default: newest } }
      responses:
        "200": { description: Paginated public products, content: { application/json: { schema: { $ref: "#/components/schemas/ProductList" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /products/{slug}:
    get:
      tags: [Public]
      summary: Published product detail; drafts and archives are indistinguishable from missing products
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Product with active variants and visible images, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /categories:
    get:
      tags: [Public]
      summary: Categories with published products or published descendants
      responses:
        "200": { description: Category items, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Category" } } } } } } }
  /orders/delivery-options:
    get:
      tags: [Orders]
      summary: Static Bangladesh district delivery options and rates
      responses:
        "200": { description: Districts with Tk 80 Dhaka / Tk 100 non-Dhaka charges }
  /orders/payment-mode:
    get:
      tags: [Orders]
      summary: Get the backend checkout mode
      responses:
        "200": { description: Current mode, content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [offline, sslcommerz_sandbox] } } } } } }
  /orders/payment-status:
    post:
      tags: [Orders]
      summary: Check sandbox payment status using the private checkout key
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string, format: uuid } } }
      responses:
        "200": { description: Order receipt and payment status, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentReceipt" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /orders/resume-payment:
    post:
      tags: [Orders]
      summary: Continue an eligible sandbox payment after guest verification
      description: Requires the order number and matching email or phone. The existing reservation must still be active. A failed or cancelled provider session may not be reusable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderLookup" }
      responses:
        "200":
          {
            description: Existing sandbox gateway URL and short-lived order-scoped status token,
            content: { application/json: { schema: { type: object, required: [orderId, gatewayUrl, statusToken], properties: { orderId: { type: string, format: uuid }, gatewayUrl: { type: string, format: uri }, statusToken: { type: string } } } } },
          }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /orders/guest-payment-status:
    post:
      tags: [Orders]
      summary: Check one order using its scoped guest payment status token
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [orderId, statusToken], properties: { orderId: { type: string, format: uuid }, statusToken: { type: string, maxLength: 2048 } } }
      responses:
        "200": { description: Order receipt and payment status without a gateway URL, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentReceipt" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /orders:
    post:
      tags: [Orders]
      summary: Place a guest order and reserve stock
      description: Offline mode preserves unpaid manual review. Sandbox mode requires an idempotency key and returns a hosted gateway URL or a pending initiation status. Prices and delivery charges are server-calculated. Limited to 10 attempts per IP per 15 minutes.
      parameters:
        - { name: idempotency-key, in: header, required: false, description: Required UUID in sandbox mode; reuse for retries of the same order, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
      responses:
        "201": { description: Order receipt; sandbox responses also include paymentStatus and gatewayUrl, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentReceipt" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /orders/lookup:
    post:
      tags: [Orders]
      summary: Look up one guest order by order number and matching email or phone
      description: Limited to five attempts per IP per 15 minutes. The contact must match the order. The payment summary contains only status, expiry and availability; it does not expose a checkout key or gateway URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderLookup" }
      responses:
        "200": { description: Matching order snapshot with item subtotal, delivery charge, and total, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /payments/ipn:
    post:
      tags: [Orders]
      summary: Receive sandbox payment notification and validate it with the provider
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { val_id: { type: string, maxLength: 100 } } }
      responses:
        "200": { description: Notification accepted }
        "400": { $ref: "#/components/responses/Error" }
  /payments/success:
    post:
      tags: [Orders]
      summary: Validate a sandbox browser return and redirect to the payment status page
      responses:
        "303": { description: Redirect to payment status }
  /payments/fail:
    post:
      tags: [Orders]
      summary: Redirect a sandbox failure return to the payment status page
      responses:
        "303": { description: Redirect to payment status }
  /payments/cancel:
    post:
      tags: [Orders]
      summary: Redirect a sandbox cancellation return to the payment status page
      responses:
        "303": { description: Redirect to payment status }
  /auth/csrf:
    get:
      tags: [Authentication]
      summary: Issue an HttpOnly CSRF cookie and matching response token
      responses:
        "200": { description: Send token as x-csrf-token on mutations, content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Password login for approved active admin accounts
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, maxLength: 200 } } }
      responses:
        "200": { description: User and HttpOnly access/refresh cookies }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh session; reuse revokes the whole token family
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      responses:
        "200": { description: Updated access/refresh cookies and user }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke refresh session and clear cookies
      tags: [Authentication]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      responses:
        "200": { description: Session revoked and cookies cleared }
  /auth/me:
    get:
      summary: Get the authenticated user
      tags: [Authentication]
      security: [{ adminCookie: [] }]
      responses:
        "200": { description: Current approved active user }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      summary: Change own password and revoke sessions
      tags: [Authentication]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [currentPassword, password], properties: { currentPassword: { type: string }, password: { type: string, minLength: 6, maxLength: 200 } } }
      responses:
        "200": { description: Password changed; all user sessions revoked }
  /auth/google:
    get:
      tags: [Authentication]
      summary: Begin state/nonce/PKCE Google sign-in
      responses:
        "302": { description: Google authorization URL or configured unavailable page }
  /auth/google/link:
    get:
      tags: [Authentication]
      security: [{ adminCookie: [] }]
      summary: Begin authenticated identity linking, never email-only auto-linking
      responses:
        "302": { description: Google authorization URL }
  /auth/google/callback:
    get:
      summary: Validate Google identity and complete sign-in or linking
      tags: [Authentication]
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302": { description: "Dashboard, pending approval, linked account or safe failure page" }
  /admin/overview:
    get:
      summary: Get catalogue overview counts
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      responses:
        "200": { description: Product/status/category counts; pending users only for ADMIN }
  /admin/orders:
    get:
      summary: List guest orders for manual review
      tags: [Orders]
      security: [{ adminCookie: [] }]
      responses:
        "200": { description: Order snapshots, customer delivery details, item subtotals, delivery charges, grand totals, and current review states, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Order" } } } } } } }
  /admin/orders/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Edit a pending order's items and customer details
      tags: [Orders]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      description: Requires the latest updatedAt. Item changes recalculate current prices and adjust stock reservations atomically; district changes recalculate the delivery charge. Legacy orders keep their existing free-form address and zero charge until a district is explicitly set. Contact-only edits preserve item price snapshots. Confirmed, rejected, and online-payment orders cannot be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderEdit" }
      responses:
        "200": { description: Edited order remains pending review, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/orders/{id}/status:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Confirm or reject a pending order
      tags: [Orders]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      description: Confirmation consumes reserved stock. Rejection releases it. Online orders must have verified non-risky payment; rejecting a paid order marks it refund-required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, enum: [CONFIRMED, REJECTED] } } }
      responses:
        "200": { description: Updated order and item snapshots, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /admin/orders/{id}/payment/risk-review:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Orders]
      summary: Approve or reject a risk-flagged payment (ADMIN only)
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], additionalProperties: false, properties: { decision: { type: string, enum: [APPROVE, REJECT] } } }
      responses:
        "204": { description: Risk decision recorded }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/orders/{id}/payment/refund:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Orders]
      summary: Record a full refund already completed externally (ADMIN only)
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [amount, reference, note], properties: { amount: { $ref: "#/components/schemas/Money" }, reference: { type: string, minLength: 1, maxLength: 100 }, note: { type: string, minLength: 1, maxLength: 500 } } }
      responses:
        "204": { description: External refund recorded; no refund is sent by this API }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/orders/{id}/payment/duplicate/{chargeId}/refund:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: chargeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Orders]
      summary: Record an external refund for an additional validated charge (ADMIN only)
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [amount, reference, note], properties: { amount: { $ref: "#/components/schemas/Money" }, reference: { type: string, minLength: 1, maxLength: 100 }, note: { type: string, minLength: 1, maxLength: 500 } } }
      responses:
        "204": { description: External refund recorded; the original payment is unchanged }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/products:
    get:
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      summary: All statuses; same pagination/search/category/sort as public listing
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Paginated admin products, content: { application/json: { schema: { $ref: "#/components/schemas/ProductList" } } } }
    post:
      summary: Create product with default variant
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ProductInput" }
                - { type: object, required: [defaultVariant], properties: { defaultVariant: { $ref: "#/components/schemas/VariantInput" } } }
      responses:
        "201": { description: Draft created with an active default variant }
        "409": { $ref: "#/components/responses/Error" }
  /admin/products/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: Get an admin product aggregate
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      responses:
        "200": { description: Admin product aggregate, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
    patch:
      summary: Update product fields or publishing state
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      description: Supply only changed ProductInput fields. Omitted values remain unchanged. Publishing requires usable imagery and one active default variant.
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Updated product }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete product and queue media cleanup
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      responses:
        "204": { description: Product removed; managed media deletion queued durably }
  /admin/products/{id}/variants:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Add a dynamic variant
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VariantInput" } } } }
      responses:
        "201": { description: Updated aggregate with new variant }
        "409": { $ref: "#/components/responses/Error" }
  /admin/variants/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Update variant or reassign default
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      description: Partial VariantInput. Setting isDefault reassigns it transactionally.
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Updated aggregate }
    delete:
      summary: Delete a non-default variant
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      responses:
        "200": { description: Updated aggregate; default deletion blocked }
        "409": { $ref: "#/components/responses/Error" }
  /admin/categories:
    get:
      summary: List all admin categories
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      responses:
        "200": { description: All categories with direct product counts }
    post:
      summary: Create category
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses:
        "201": { description: Category created }
  /admin/categories/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Update or reparent category
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      description: Partial CategoryInput; parent cycles rejected.
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Category updated }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete an unreferenced category
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      responses:
        "204": { description: Empty category removed }
        "409": { $ref: "#/components/responses/Error" }
  /admin/uploads:
    post:
      summary: Upload validated product photographs
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [productId, images]
              properties:
                productId: { type: string, format: uuid }
                variantId: { type: string, format: uuid }
                alt: { type: string, maxLength: 300 }
                images: { type: array, minItems: 1, maxItems: 8, items: { type: string, format: binary } }
      responses:
        "201": { description: Uploaded image items }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /admin/products/{id}/images/order:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Atomically reorder all owned product images
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [imageIds], properties: { imageIds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } } } }
      responses:
        "200": { description: Complete image order persisted transactionally }
        "409": { description: Image list changed or includes another product's image }
  /admin/images/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Edit alt text, image order or variant assignment
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { alt: { type: string, maxLength: 300 }, sortOrder: { type: integer, minimum: 0 }, variantId: { type: [string, "null"], format: uuid } } }
      responses:
        "200": { description: Image updated; variant must belong to same product }
    delete:
      summary: Delete image and queue provider cleanup
      tags: [Catalogue management]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      responses:
        "204": { description: Image removed; provider cleanup queued }
        "409": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      summary: List admin users
      tags: [Users]
      security: [{ adminCookie: [] }]
      description: ADMIN only. Never returns password hashes or sessions.
      responses:
        "200": { description: User items }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create approved admin user
      tags: [Users]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, email, password], properties: { name: { type: string, maxLength: 120 }, email: { type: string, format: email }, password: { type: string, minLength: 6, maxLength: 200 }, role: { type: string, enum: [ADMIN, EDITOR], default: EDITOR } } }
      responses:
        "201": { description: Active approved user created by ADMIN }
  /admin/users/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      summary: Edit, approve or disable an admin user
      tags: [Users]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      description: ADMIN only. Updates revoke sessions. Last active ADMIN is protected.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, email: { type: string, format: email }, role: { type: string, enum: [ADMIN, EDITOR] }, isActive: { type: boolean }, approve: { type: boolean }, password: { type: string, minLength: 6, maxLength: 200 } } }
      responses:
        "200": { description: Updated user }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete user or reject pending signup
      tags: [Users]
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Csrf" }]
      responses:
        "204": { description: ADMIN-only deletion or pending-signup rejection }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    adminCookie: { type: apiKey, in: cookie, name: access, description: Short-lived JWT; refresh is an independently rotated HttpOnly cookie }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Csrf: { name: x-csrf-token, in: header, required: true, schema: { type: string }, description: Must match CSRF cookie; exact trusted Origin also required }
  responses:
    Error:
      description: Validated error. Common statuses are 400, 401, 403, 404, 409, 413, 429 and 500.
      content:
        application/json:
          schema: { type: object, properties: { error: { type: object, properties: { message: { type: string }, requestId: { type: string }, fields: { type: object } } } } }
  schemas:
    Money: { type: string, pattern: '^\d{1,10}(\.\d{1,2})?$', example: "1890.00" }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        description: { type: string, maxLength: 2000 }
        parentId: { type: [string, "null"], format: uuid }
    Category:
      allOf:
        - { $ref: "#/components/schemas/CategoryInput" }
        - { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
    ProductInput:
      type: object
      required: [name, slug, description, categoryId, price]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        description: { type: string, minLength: 1, maxLength: 20000 }
        categoryId: { type: string, format: uuid }
        price: { $ref: "#/components/schemas/Money" }
        discountPercentage: { type: string, description: Decimal between 0 and 100 inclusive }
        featured: { type: boolean }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
    VariantInput:
      type: object
      required: [name, sku]
      properties:
        name: { type: string, maxLength: 160 }
        sku: { type: string, maxLength: 80, description: "Globally unique, normalized to uppercase" }
        price: { anyOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: Null inherits product base price }
        attributes: { type: object, maxProperties: 20, additionalProperties: { type: string, minLength: 1, maxLength: 100 } }
        isDefault: { type: boolean }
        isActive: { type: boolean }
        stockOnHand: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    Product:
      allOf:
        - { $ref: "#/components/schemas/ProductInput" }
        - type: object
          required: [id, category, variants, images, fromPrice, hasPriceRange, currency]
          properties:
            id: { type: string, format: uuid }
            category: { $ref: "#/components/schemas/Category" }
            currency: { type: string, const: BDT }
            fromPrice: { $ref: "#/components/schemas/Money" }
            hasPriceRange: { type: boolean }
            variants:
              {
                type: array,
                items:
                  {
                    allOf:
                      [
                        { $ref: "#/components/schemas/VariantInput" },
                        {
                          type: object,
                          required: [id, effectivePrice, inStock, availableQuantity],
                          properties: { id: { type: string }, effectivePrice: { $ref: "#/components/schemas/Money" }, inStock: { type: boolean }, stockReserved: { type: integer }, availableQuantity: { type: integer, minimum: 0 } },
                        },
                      ],
                  },
              }
            images: { type: array, items: { type: object, properties: { id: { type: string }, imageUrl: { type: string, format: uri }, alt: { type: string }, sortOrder: { type: integer }, variantId: { type: [string, "null"] } } } }
    ProductList:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Product" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    BangladeshDistrict:
      type: string
      enum:
        [
          Bagerhat,
          Bandarban,
          Barguna,
          Barishal,
          Bhola,
          Bogura,
          Brahmanbaria,
          Chandpur,
          Chattogram,
          Chuadanga,
          "Cox's Bazar",
          Cumilla,
          Dhaka,
          Dinajpur,
          Faridpur,
          Feni,
          Gaibandha,
          Gazipur,
          Gopalganj,
          Habiganj,
          Jamalpur,
          Jashore,
          Jhalokati,
          Jhenaidah,
          Joypurhat,
          Khagrachhari,
          Khulna,
          Kishoreganj,
          Kurigram,
          Kushtia,
          Lakshmipur,
          Lalmonirhat,
          Madaripur,
          Magura,
          Manikganj,
          Meherpur,
          Moulvibazar,
          Munshiganj,
          Mymensingh,
          Naogaon,
          Narail,
          Narayanganj,
          Narsingdi,
          Natore,
          Netrokona,
          Nilphamari,
          Noakhali,
          Pabna,
          Panchagarh,
          Patuakhali,
          Pirojpur,
          Rajbari,
          Rajshahi,
          Rangamati,
          Rangpur,
          Satkhira,
          Shariatpur,
          Sherpur,
          Sirajganj,
          Sunamganj,
          Sylhet,
          Tangail,
          Thakurgaon,
          Chapainawabganj,
        ]
    OrderLookup:
      type: object
      additionalProperties: false
      required: [orderNumber]
      properties:
        orderNumber: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 7, maxLength: 30 }
      oneOf:
        - required: [email]
        - required: [phone]
    CreateOrder:
      type: object
      additionalProperties: false
      required: [customerName, email, phone, deliveryAddress, district, postcode, items]
      properties:
        customerName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 7, maxLength: 30 }
        deliveryAddress: { type: string, minLength: 5, maxLength: 500 }
        district: { $ref: "#/components/schemas/BangladeshDistrict" }
        postcode: { type: string, pattern: "^[0-9]{4}$" }
        customerNote: { type: string, maxLength: 1000, default: "" }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [variantId, quantity]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 20 }
    PaymentReceipt:
      type: object
      required: [id, status, subtotal, deliveryCharge, total]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_REVIEW, CONFIRMED, REJECTED] }
        subtotal: { $ref: "#/components/schemas/Money" }
        deliveryCharge: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        paymentStatus: { type: string, enum: [INITIATING, PENDING, PAID, RISK_REVIEW, EXPIRED, REFUND_REQUIRED, REFUNDED] }
        gatewayUrl: { type: [string, "null"], format: uri }
    Order:
      type: object
      required: [id, status, customerName, email, phone, deliveryAddress, deliveryArea, district, postcode, customerNote, subtotal, deliveryCharge, total, items, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_REVIEW, CONFIRMED, REJECTED] }
        customerName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        deliveryAddress: { type: string }
        deliveryArea: { type: string }
        district: { oneOf: [{ $ref: "#/components/schemas/BangladeshDistrict" }, { type: "null" }] }
        postcode: { type: [string, "null"], pattern: "^[0-9]{4}$" }
        customerNote: { type: string }
        subtotal: { $ref: "#/components/schemas/Money" }
        deliveryCharge: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        payment:
          description: Sanitized status for guests; authenticated admin responses include additional refund details.
          oneOf:
            - type: "null"
            - type: object
              required: [status, expiresAt, canContinue]
              properties:
                status: { type: string, enum: [INITIATING, PENDING, PAID, RISK_REVIEW, EXPIRED, REFUND_REQUIRED, REFUNDED] }
                expiresAt: { type: string, format: date-time }
                canContinue: { type: boolean }
            - type: object
              required: [status, expiresAt, paidAt, bankTransactionId, refundAmount, refundReference, refundNote, refundedBy, refundedAt, duplicateCharges]
              properties:
                status: { type: string, enum: [INITIATING, PENDING, PAID, RISK_REVIEW, EXPIRED, REFUND_REQUIRED, REFUNDED] }
                expiresAt: { type: string, format: date-time }
                paidAt: { type: [string, "null"], format: date-time }
                bankTransactionId: { type: [string, "null"] }
                refundAmount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
                refundReference: { type: [string, "null"] }
                refundNote: { type: [string, "null"] }
                refundedBy: { type: [string, "null"] }
                refundedAt: { type: [string, "null"], format: date-time }
                duplicateCharges:
                  type: array
                  items:
                    {
                      type: object,
                      properties:
                        { id: { type: string, format: uuid }, bankTransactionId: { type: [string, "null"] }, refundReference: { type: [string, "null"] }, refundNote: { type: [string, "null"] }, refundedBy: { type: [string, "null"] }, refundedAt: { type: [string, "null"], format: date-time } },
                    }
        items:
          type: array
          items:
            type: object
            required: [id, productId, variantId, productName, variantName, sku, quantity, unitPrice, lineTotal]
            properties:
              id: { type: string, format: uuid }
              productId: { type: [string, "null"], format: uuid }
              variantId: { type: [string, "null"], format: uuid }
              productName: { type: string }
              variantName: { type: string }
              sku: { type: string }
              quantity: { type: integer }
              unitPrice: { $ref: "#/components/schemas/Money" }
              lineTotal: { $ref: "#/components/schemas/Money" }
    OrderEdit:
      type: object
      additionalProperties: false
      required: [updatedAt, customerName, email, phone, deliveryAddress, deliveryArea, district, postcode, customerNote, items]
      properties:
        updatedAt: { type: string, format: date-time, description: Last-seen order timestamp; stale edits conflict }
        customerName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 7, maxLength: 30 }
        deliveryAddress: { type: string, minLength: 5, maxLength: 500 }
        deliveryArea: { type: string, maxLength: 120 }
        district: { oneOf: [{ $ref: "#/components/schemas/BangladeshDistrict" }, { type: "null" }] }
        postcode: { oneOf: [{ type: string, pattern: "^[0-9]{4}$" }, { type: "null" }] }
        customerNote: { type: string, maxLength: 1000 }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [variantId, quantity]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 20 }
